spring.application.name=sims-server
server.port=8081

# Local development database (embedded H2)
spring.datasource.url=jdbc:h2:mem:simsdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# RFC 7807 Problem Details
spring.mvc.problemdetails.enabled=true

# JWT
jwt.secret=c2xpaXQtc2ltcy1zZTIwMzAtand0LXNlY3JldC1rZXktMjAyNi1wcm9qZWN0LXNlY3VyaXR5
jwt.expiration-ms=86400000

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
