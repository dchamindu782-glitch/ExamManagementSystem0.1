server.port=8080

# SQL Server SQLEXPRESS Connection (Properly escaped database name)
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=SIS BASE;encrypt=true;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=004602

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Disable internal SQL scripts
spring.sql.init.mode=never
spring.thymeleaf.cache=false